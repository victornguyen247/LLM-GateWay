kind: Deployment
apiVersion: apps/v1
metadata:
  name: llm-gateway
spec:
  replicas: 1

  selector:
    matchLabels:
      app: llm-gateway
  
  template:
    metadata:
      labels:
        app: llm-gateway
    
    spec:
      containers:
      - name: gateway
        image: gateway:v1
        imagePullPolicy: Always
        
        ports:
          - containerPort: 8080
        
        envFrom:
        - secretRef:
            name: gateway-secret

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
            
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5