kind: Deployment
apiVersion: apps/v1
metadata:
  name: llm-gateway
spec:
  replicas: 1

  selector:
    matchLabels:
      app: llm-gateway
  
  template:
    metadata:
      labels:
        app: llm-gateway
    
    spec:
      containers:
      - name: llm-gateway
        image: llm-gateway:v0.1
        imagePullPolicy: IfNotPresent
        
        ports:
          - containerPort: 8080
        
        envFrom:
        - secretRef:
            name: gateway-secret

        env:
        - name: OPENAI_API_KEY
        - name: GATEWAY_LISTEN
          value: "8080"
            
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10