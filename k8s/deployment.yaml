kind: Deployment
apiVersion: apps/v1
metadata:
  name: llm-gateway
spec:
  replicas: 2

  selector:
    matchLabels:
      app: llm-gateway
  
  template:
    metadata:
      labels:
        app: llm-gateway
    
    spec:
      containers:
      - name: gateway
        image: llm-gateway:v0.2
        imagePullPolicy: IfNotPresent
        
        ports:
          - containerPort: 8080
        
        envFrom:
        - secretRef:
            name: gateway-secret

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: RATE_LIMIT_BACKEND
          value: "redis"
        - name: CACHE_BACKEND
          value: "redis"
        - name: RATE_LIMIT_RPS
          value: "1"        
        - name: RATE_LIMIT_BURST
          value: "1"
        - name: CACHE_TTL
          value: "5m"
            
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0