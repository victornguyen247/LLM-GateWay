<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">LLM Gateway v2  shared state (kind)</text>

  <!-- Client -->
  <rect x="40" y="160" width="120" height="56" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="100" y="192" text-anchor="middle" font-size="14" fill="#0f172a">Client</text>

  <!-- Service -->
  <rect x="220" y="148" width="140" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="290" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Service</text>
  <text x="290" y="200" text-anchor="middle" font-size="12" fill="#1e40af">llm-gateway</text>

  <!-- Pods -->
  <rect x="420" y="90" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="495" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Pod A</text>
  <text x="495" y="140" text-anchor="middle" font-size="11" fill="#166534">gateway replica</text>

  <rect x="420" y="210" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="495" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Pod B</text>
  <text x="495" y="260" text-anchor="middle" font-size="11" fill="#166534">gateway replica</text>

  <!-- Redis -->
  <rect x="640" y="148" width="120" height="80" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="700" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Redis</text>
  <text x="700" y="200" text-anchor="middle" font-size="11" fill="#991b1b">StatefulSet</text>

  <!-- OpenAI -->
  <rect x="640" y="300" width="120" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="700" y="332" text-anchor="middle" font-size="13" fill="#78350f">OpenAI</text>

  <!-- Arrows -->
  <line x1="160" y1="188" x2="218" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="175" x2="418" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="200" x2="418" y2="245" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="125" x2="638" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="245" x2="638" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="160" x2="495" y2="208" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="510" y="188" font-size="10" fill="#64748b">shared keys</text>
  <line x1="495" y1="280" x2="638" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="160" x2="495" y2="208" stroke="none"/>
  <line x1="520" y1="328" x2="638" y2="328" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="460" y="390" text-anchor="middle" font-size="12" fill="#475569">Rate limit + response cache: memory (dev) or Redis (multi-replica). One REDIS_URL when either backend is redis.</text>
</svg>
